<div class="header-bar">
	<button (click)="routeToHome()" i18n="@@header.home">Home</button>
	<button (click)="routeToGames()" i18n="@@header.games">Games</button>
	<div class = "header-spacer"></div>
	<form class="header-search" (submit)="$event.preventDefault(); onSearch(searchInput.value)">
		<input #searchInput type="search" placeholder="Search game or user" aria-label="Search" i18n-placeholder="@@header.searchPlaceholder" i18n-aria-label="@@header.searchAriaLabel" />
		<button type="submit" aria-label="Search" i18n-aria-label="@@header.searchButtonAriaLabel">
			<ng-icon name="octSearch" size="36px" ></ng-icon>
		</button>
	</form>
	@if (authService.isAuthenticated()) {
		<button (click)="routeToMySubmissions()" i18n="@@header.mySubmissions">My Submissions</button>
		<button class="profile-button" (click)="routeToProfile()">
			@if (profileImageUrl()) {
				<img [src]="profileImageUrl()" alt="Profile" class="profile-avatar" i18n-alt="@@header.profileAlt" />
			} @else {
				<ng-icon name="octFeedPerson" size="24px"></ng-icon>
			}
			<span class="username">  {{ username() ?? accountFallback() }} </span>
		</button>
		<button (click)="onLogout()" i18n="@@header.logout">Logout</button>
	} @else {
		<button (click)="routeToRegister()" i18n="@@header.register">Register</button>
		<button (click)="routeToLogin()" i18n="@@header.login">Login</button>
	}
	<app-dropdown-menu class="langSelector"
		[elements]="availableLanguageOptions()"
		[selectedValue]="currentLanguage()"
		(onSelect)="onLanguageSelect($event)"></app-dropdown-menu>
</div>
