<div class="games-container">
  <div class="games-header">
    <h2 i18n="@@games.title">All Games</h2>
    @if (authService.hasRole('Admin')) {
      <button (click)="routeToNewGame()" i18n="@@games.newGame">
        <ng-icon name="octPlus" size="24px"></ng-icon>
        <span class="new-game-label">New game</span>
      </button>
    }
  </div>

  <div class="games-filters">
    <label for="game-name" i18n="@@games.filter.gameName">Game name</label>
    <input
      id="game-name"
      type="search"
      [value]="searchQuery()"
      (input)="setSearchQuery($event)"
      placeholder="Search games"
      i18n-placeholder="@@games.filter.searchPlaceholder"
    />

    @if (authService.isAuthenticated()) {
      <label class="submitted-filter">
        <input
          type="checkbox"
          [checked]="showSubmittedOnly()"
          (change)="toggleSubmittedOnly()"
        />
        <span i18n="@@games.filter.submittedOnly">Games I submitted scores to</span>
      </label>
    }
  </div>

  <div class="games-grid">
    @for (game of filteredGames(); track game.id) {
      <app-game-card [game]="game" (click)="viewGame(game.id)"></app-game-card>
    } @empty {
      <p i18n="@@games.empty">No games found.</p>
    }
  </div>
</div>
