<div class="games-container">
  <div class="games-header">
    <h2>All Games</h2>
    @if (authService.hasRole('Admin')) {
      <button (click)="routeToNewGame()">
        <ng-icon name="octPlus" size="24px"></ng-icon>
        <span class="new-game-label">New game</span>
      </button>
    }
  </div>

  <div class="games-filters">
    <label for="game-name">Game name</label>
    <input
      id="game-name"
      type="search"
      [value]="searchQuery()"
      (input)="setSearchQuery($event)"
      placeholder="Search games"
    />

    @if (authService.isAuthenticated()) {
      <label class="submitted-filter">
        <input
          type="checkbox"
          [checked]="showSubmittedOnly()"
          (change)="toggleSubmittedOnly()"
        />
        Games I submitted scores to
      </label>
    }
  </div>

  <div class="games-grid">
    @for (game of filteredGames(); track game.id) {
      <app-game-card [game]="game" (click)="viewGame(game.id)"></app-game-card>
    } @empty {
      <p>No games found.</p>
    }
  </div>
</div>
